interface:
  display_name: "Remote Runner"
  short_description: "Run, follow, and validate durable remote workloads"
  default_prompt: "Use $remote-runner to submit my clean committed HEAD and return the exact run ID after the durable queue record is accepted, and use validate-run when an already reportable run needs a project validator. Detach by default; use an attached --wait --until reportable only when I explicitly ask to wait. If I explicitly request a background supervisor, use one wait-cohort without --max-wait for all exact source IDs, validate each reportable source run through its frozen validate-run, and make parent delivery external to Remote Runner. Never add model polling or exploratory probes, interpret scientific validity, or copy run records into Trellis; report exit codes as given."
