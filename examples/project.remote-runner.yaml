project_id: example

controller:
  ssh: controller.example
  root: /srv/remote-runner

source:
  mode: git-worktree
  local_repo: .

dev:
  stale_after_seconds: 86400
  include: []
  exclude:
    - local-large-data/
  profiles:
    full-tests:
      command: scripts/validate-full-tests.sh
      include:
        - artifacts/native-program.bin

remote:
  compute-a:
    enabled: true
    auto_select: true
    bare_repo: /srv/example/repo.git
    worktree_root: /srv/example/worktrees
    python: /srv/example/venv/bin/python
    output_root: /srv/example/output
  archive:
    enabled: true
    auto_select: false
    bare_repo: /srv/example/repo.git
    worktree_root: /srv/example/worktrees
    python: /srv/example/venv/bin/python
    output_root: /srv/archive/example

scheduling:
  strategy: max_available_cores
  lease_seconds: 120
  probe_interval_seconds: 60
  testing:
    servers:
      - compute-a
