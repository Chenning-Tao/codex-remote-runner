[project]
name = "codex-remote-runner"
version = "0.10.0"
description = "Durable remote workload scheduling and lifecycle management for Codex"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["codex", "remote-execution", "scheduler", "ssh", "workloads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
web = [
    "starlette>=1.3.1,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
remote-runner = "remote_runner.cli:main"

[project.urls]
Documentation = "https://github.com/Chenning-Tao/codex-remote-runner#readme"
Issues = "https://github.com/Chenning-Tao/codex-remote-runner/issues"
Repository = "https://github.com/Chenning-Tao/codex-remote-runner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.12,<1",
    "setproctitle>=1.3,<2",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_runner"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/agents",
    "/examples",
    "/references",
    "/scripts",
    "/src",
    "/tests",
    "/web",
    "/.gitignore",
    "/.python-version",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/README.zh-CN.md",
    "/SECURITY.md",
    "/SKILL.md",
    "/pyproject.toml",
    "/pyrightconfig.json",
    "/uv.lock",
]
exclude = [
    "/.trellis",
    "/dist",
    "/web/node_modules",
]
